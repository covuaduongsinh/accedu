# Cấu hình Supabase CLI (supabase start / db reset / gen types)
project_id = "accedu"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 5000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "tauri://localhost", "accedu://"]
# Tài khoản do quản trị tạo (Edge Function admin-users) — giống DISABLE_SIGNUP=true trên máy chủ
enable_signup = false

[auth.email]
# Giữ bật: đây là công tắc của cả phương thức đăng nhập email (tắt thì không ai đăng nhập được)
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true

# Function tự kiểm tra JWT của người gọi (để preflight CORS không bị chặn)
[functions.admin-users]
verify_jwt = false

# Kế toán gửi tay (function tự kiểm tra JWT) hoặc lịch pg_cron (header x-cron-token)
[functions.tuition-reminders]
verify_jwt = false

# Hỏi AccEdu (function tự kiểm tra JWT, gọi báo cáo bằng chính JWT người hỏi)
[functions.ai-ask]
verify_jwt = false
