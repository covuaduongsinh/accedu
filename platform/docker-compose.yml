# AccEdu Platform — Postgres + PostgREST + AccEdu server (auth/realtime) + Caddy (HTTPS) + sao lưu
# Chạy: docker compose --env-file .env up -d   (tạo .env bằng scripts/bootstrap-env.sh)
name: accedu

x-db-admin: &db-admin postgres://postgres:${POSTGRES_PASSWORD}@db:5432/accedu

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: accedu
      TZ: Asia/Ho_Chi_Minh
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE:-1536MB}
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=1000
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d accedu"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  migrate:
    build: { context: .., dockerfile: apps/server/Dockerfile }
    image: accedu-server:local
    pull_policy: build
    command: ["node", "src/cli.ts", "migrate"]
    environment:
      DATABASE_ADMIN_URL: *db-admin
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
      SERVER_DB_PASSWORD: ${SERVER_DB_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  rest:
    image: postgrest/postgrest:v16.5
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/accedu
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_AUD: authenticated
      PGRST_DB_MAX_ROWS: "5000"
      PGRST_DB_CHANNEL_ENABLED: "true"
      PGRST_OPENAPI_MODE: disabled
      PGRST_SERVER_PORT: "3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]

  server:
    build: { context: .., dockerfile: apps/server/Dockerfile }
    image: accedu-server:local
    pull_policy: build
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://accedu_server:${SERVER_DB_PASSWORD}@db:5432/accedu
      JWT_SECRET: ${JWT_SECRET}
      ANON_KEY: ${ANON_KEY:-accedu-public-anon}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ANON_KEY: ${ANON_KEY:-accedu-public-anon}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [rest, server]
    networks: [internal]

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Ho_Chi_Minh
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

volumes:
  db-data:
  caddy-data:
  caddy-config:

networks:
  internal:
