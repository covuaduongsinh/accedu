name: Desktop release

# Build bộ cài Windows (MSI/NSIS), macOS (DMG) và Linux (AppImage/deb).
# Chạy tay (Actions → Desktop release → Run workflow) hoặc khi gắn tag v*.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: macos-latest
            bundles: dmg,app
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Thư viện hệ thống (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://supabaseaccedu.dsc.edu.vn' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: pnpm --filter @accedu/desktop exec tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: accedu-desktop-${{ runner.os }}
          path: apps/desktop/src-tauri/target/release/bundle/**
