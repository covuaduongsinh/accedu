name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · typecheck · unit · CSDL
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test core & api
        run: pnpm --filter @accedu/core --filter @accedu/api test
      - name: Test CSDL (Postgres 16 local + migration + RLS)
        run: pnpm db:test
      - name: Test AccEdu server (auth, realtime, quản trị)
        run: pnpm --filter @accedu/server test
      - name: Seed khớp packages/core
        run: |
          node supabase/scripts/gen-seed.ts
          git diff --exit-code supabase/seed.sql

  web-e2e:
    name: Web build + E2E (AccEdu Platform trong Docker)
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Khởi động AccEdu Platform (build image server)
        working-directory: platform
        env:
          API_DOMAIN: ":80"
          HTTP_PORT: "8000"
          HTTPS_PORT: "8443"
          CORS_ORIGIN_REGEX: "^http://localhost:5173$"
        run: |
          ./scripts/bootstrap-env.sh
          docker compose --env-file .env -f docker-compose.yml -f compose.ci.yml up -d --build db migrate rest server caddy
          for i in $(seq 60); do curl -fsS http://localhost:8000/healthz && break; sleep 2; done
          echo
          curl -fsS http://localhost:8000/auth/v1/settings
          docker compose --env-file .env -f docker-compose.yml -f compose.ci.yml logs --no-log-prefix migrate
      - name: Cấu hình web
        run: echo 'VITE_API_URL=http://localhost:8000' > apps/web/.env.local
      - run: pnpm --filter @accedu/web build
      - run: pnpm --filter @accedu/web exec playwright install --with-deps chromium
      - name: E2E (chủ sở hữu tạo bằng CLI, đồng bộ 2 thiết bị)
        run: |
          set -a; . platform/.env; set +a
          E2E_DATABASE_ADMIN_URL="postgres://postgres:${POSTGRES_PASSWORD}@127.0.0.1:55432/accedu" pnpm --filter @accedu/web test:e2e
      - name: Log nền tảng
        if: failure()
        working-directory: platform
        run: docker compose --env-file .env -f docker-compose.yml -f compose.ci.yml logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results

  mobile:
    name: Mobile bundle (Expo)
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export Android bundle
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
          CI: 1
        run: npx expo export --platform android --output-dir dist-android

  desktop-check:
    name: Desktop (cargo check)
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v5
      - name: Thư viện hệ thống Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
