name: Mobile build (EAS)

# Cần secret EXPO_TOKEN (expo.dev → Access tokens). Biến ACCEDU_API_URL (tùy chọn) đổi địa chỉ API.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "android | ios | all"
        default: android
        required: true

jobs:
  eas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS build
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.ACCEDU_API_URL || 'https://api.217-15-160-118.sslip.io' }}
        run: eas build --platform ${{ inputs.platform }} --profile preview --non-interactive --no-wait
