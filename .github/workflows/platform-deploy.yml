name: Platform deploy (VPS)

# Triển khai AccEdu Platform (Postgres + PostgREST + server + Caddy) lên VPS qua SSH.
# Cần (Settings → Secrets and variables → Actions):
#   Secrets:   VPS_SSH_KEY (khóa riêng OpenSSH, không passphrase)
#              ACCEDU_OWNER_EMAIL, ACCEDU_OWNER_PASSWORD (chủ sở hữu lần đầu — bắt đổi mật khẩu khi đăng nhập)
#   Variables: VPS_HOST (mặc định 217.15.160.118), VPS_USER (mặc định root), VPS_PORT (mặc định 22),
#              ACCEDU_API_DOMAIN, ACCEDU_CORS_REGEX (tùy chọn)
# Chưa có VPS_SSH_KEY thì workflow bỏ qua (cảnh báo), không lỗi.
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - platform/**
      - apps/server/**
      - supabase/migrations/**
      - supabase/seed.sql
      - .github/workflows/platform-deploy.yml
  workflow_dispatch:
    inputs:
      inspect_only:
        description: "Chỉ kiểm tra máy chủ (không triển khai)"
        type: boolean
        default: false

concurrency:
  group: platform-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_DOMAIN: ${{ vars.ACCEDU_API_DOMAIN || 'api.217-15-160-118.sslip.io' }}
  # Web trên Vercel (mọi bản preview của dự án accedu), desktop Tauri, dev local
  CORS_ORIGIN_REGEX: ${{ vars.ACCEDU_CORS_REGEX || '^(https://accedu[a-z0-9-]*\.vercel\.app|http://localhost:5173|tauri://localhost|https?://tauri\.localhost)$' }}

jobs:
  test:
    name: Test server + CSDL
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:test
      - run: pnpm --filter @accedu/server test

  deploy:
    name: Kiểm tra VPS → triển khai → smoke test
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 30
    steps:
      - name: Kiểm tra secret
        id: cfg
        env:
          HAS_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::Chưa có secret VPS_SSH_KEY — bỏ qua triển khai. Thêm secret rồi chạy lại workflow."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.cfg.outputs.skip != 'true'

      - name: Cấu hình SSH
        if: steps.cfg.outputs.skip != 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST || '217.15.160.118' }}
          VPS_USER: ${{ vars.VPS_USER || 'root' }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          # Khóa dán từ Notepad có thể mang \r — bỏ đi
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          ssh-keygen -y -P '' -f ~/.ssh/id_vps > /dev/null \
            || { echo "::error::VPS_SSH_KEY sai định dạng hoặc có passphrase"; exit 1; }
          ssh-keyscan -T 20 -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/id_vps
            IdentitiesOnly yes
            ServerAliveInterval 30
            ConnectTimeout 20
          EOF
          ssh vps 'echo "Đã kết nối $(hostname) — $(whoami)"'

      - name: Kiểm tra máy chủ (chỉ đọc)
        if: steps.cfg.outputs.skip != 'true'
        run: ssh vps 'bash -s' < platform/scripts/inspect.sh

      - name: Đóng gói & chép lên VPS
        if: steps.cfg.outputs.skip != 'true' && !inputs.inspect_only
        env:
          OWNER_EMAIL: ${{ secrets.ACCEDU_OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.ACCEDU_OWNER_PASSWORD }}
        run: |
          stage=$(mktemp -d)
          git archive --format=tar.gz -o "$stage/accedu.tgz" HEAD \
            .dockerignore platform apps/server supabase/migrations supabase/seed.sql
          cp platform/scripts/deploy.sh "$stage/deploy.sh"
          {
            printf 'API_DOMAIN=%q\n' "$API_DOMAIN"
            printf 'CORS_ORIGIN_REGEX=%q\n' "$CORS_ORIGIN_REGEX"
            printf 'TENANT_SLUG=%q\n' duongsinh
            printf 'TENANT_NAME=%q\n' "Công ty CP Cờ vua Dương Sinh"
            printf 'TENANT_REGIME=%q\n' TT99
            printf 'TENANT_START=%q\n' 2026-01-01
            printf 'OWNER_NAME=%q\n' "Phùng Đức Tường"
          } > "$stage/deploy.conf"
          if [ -n "$OWNER_EMAIL" ] && [ -n "$OWNER_PASSWORD" ]; then
            (umask 077; printf 'OWNER_EMAIL=%q\nOWNER_PASSWORD=%q\n' "$OWNER_EMAIL" "$OWNER_PASSWORD" > "$stage/owner.env")
          else
            echo "::notice::Chưa có ACCEDU_OWNER_EMAIL/ACCEDU_OWNER_PASSWORD — bỏ qua tạo chủ sở hữu"
          fi
          ssh vps 'rm -rf /tmp/accedu-deploy && install -m 700 -d /tmp/accedu-deploy'
          scp -q "$stage"/* vps:/tmp/accedu-deploy/
          rm -rf "$stage"

      - name: Triển khai
        if: steps.cfg.outputs.skip != 'true' && !inputs.inspect_only
        run: ssh vps 'bash /tmp/accedu-deploy/deploy.sh'

      - name: Smoke test qua HTTPS
        if: steps.cfg.outputs.skip != 'true' && !inputs.inspect_only
        run: |
          base="https://$API_DOMAIN"
          # Lần đầu Caddy cần thời gian xin chứng chỉ TLS
          for i in $(seq 40); do
            curl -fsS --max-time 10 "$base/healthz" && break
            sleep 6
          done
          echo
          curl -fsS "$base/healthz" | grep -q '"ok"'
          curl -fsS "$base/auth/v1/settings" | grep -q '"disable_signup":true'
          curl -fsS "$base/rest/v1/currencies?select=code&limit=1" -H "apikey: accedu-public-anon" \
            -H "Authorization: Bearer accedu-public-anon" | grep -q VND
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/auth/v1/signup" -H 'content-type: application/json' -d '{}')
          [ "$code" = 403 ]
          echo "✓ $base hoạt động: healthz, auth, REST (anon), đăng ký tự do bị chặn"

      - name: Dọn khóa SSH
        if: always()
        run: rm -rf ~/.ssh/id_vps
